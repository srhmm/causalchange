[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalchange"
version = "0.1.1"
description = "Algorithms for Causal Discovery under Distribution Change"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Sarah Mameche" }]
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.0",
  "networkx>=3.0",
  "pydantic>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
[project.optional-dependencies]
spacetime = [
  "ruptures",
  "hyppo",
  "causal-learn",
]

cmm = [
  "rpy2",
]

plotting = [
  "matplotlib",
]

notebooks = [
  "jupyter",
  "ipykernel",
  "matplotlib",
]

docs = [
  "sphinx",
  "myst-parser",
  "numpydoc",
  "sphinx-rtd-theme",
  "nbsphinx",
]

dev = [
  "pytest",
  "pytest-cov",
  "pre-commit",
  "ruff",
  "build",
  "twine",
]

all = [
  "ruptures",
  "hyppo",
  "causal-learn",
  "matplotlib",
]

[project.urls]
Homepage = "https://github.com/srhmm/causalchange"
Issues = "https://github.com/srhmm/causalchange/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["examples/thesis"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
